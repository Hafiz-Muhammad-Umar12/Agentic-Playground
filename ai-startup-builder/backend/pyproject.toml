[project]
name = "ai-startup-builder"
version = "0.1.0"
description = "Multi-agent AI Startup Builder"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.0",
    "openai>=1.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "uvicorn>=0.23.0",
    "celery>=5.6.3",
    "redis>=7.4.0",
    "qdrant-client>=1.17.1",
    "fastembed>=0.8.0",
    "aiofiles>=25.1.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.26",
    "email-validator>=2.3.0",
]

[tool.uv.workspace]
members = [
    "backend",
]
